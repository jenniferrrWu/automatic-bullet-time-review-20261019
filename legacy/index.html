function modeZh(x){let v=String(x.input_mode||'');if(x.model==='wan')return x.condition_video?'视频转视频：连续81帧高光对齐源片段；显式高光索引写入提示词':'视频转视频：使用完整源视频；无显式阶段遮罩和相机轨迹';if(x.model==='hunyuan')return '视频转视频：官方编辑接口，输入受长度限制的源视频片段';if(x.model==='joyai')return '视频转视频：完整源视频流，仅用文字提示控制';if(x.model==='spacetimepilot')return x.input_t_star_frame!==undefined?'视频转视频：高光对齐源片段＋精确高光冻结时间曲线＋重新定时的官方相机轨迹':'视频转视频：源视频＋官方固定时间曲线＋统一右向环绕相机控制';if(x.model==='bullettime'){let z=v.match(/(\d+) real source frames from original frames ([0-9]+)[–-]([0-9]+)/);return z?'视频转视频：原视频第 '+z[2]+'–'+z[3]+' 帧，共 '+z[1]+' 个真实帧':'视频转视频：源片段＋显式时间与相机控制'}return v.startsWith('I2V')?'图片生成视频：只用高光单帧，不输入完整源视频':v}
function limitZh(x){if(x.model==='wan')return '官方接口仍无精确冻结时间曲线或相机轨迹；视频片段对齐不等于模型完成任务。';if(x.model==='hunyuan')return '官方V2V编辑可输入源片段，但没有精确高光冻结与源相机路径控制。';if(x.model==='joyai')return '仅文字描述三阶段；不支持精确高光帧、时间曲线或相机轨迹。';if(x.model==='spacetimepilot')return x.input_t_star_frame!==undefined?'高光冻结时间已对齐，但真实源相机路径未测得；竖屏以补边方式输入固定横屏画布，不能算原生竖屏。':'旧版时间曲线为官方固定模式，未对齐人工高光帧。';if(x.model==='bullettime')return x.prompt_version&&x.prompt_version.startsWith('v6')?'时间/相机控制已传入且正向提示词未超过226 token；真实场景尺度和源相机路径仍未测得。':'时间/相机控制已传入，但环绕基于假定场景尺度，未测得真实三维几何；旧版统一提示词超过官方226-token上限。';return '仅高光单帧基线，不属于严格V2V测试。'}
function noteZh(x){let n=String(x.manual_visual_note||'');if(!n)return '';let chinese=n.split('条件限制：')[0].trim();if(/[\u3400-\u9fff]/.test(chinese))return chinese;return '尚待逐帧人工验收；生成成功不代表三阶段完成。'}
function info(c,x){let mismatch=ori(c.source_resolution)!=='未知'&&ori(x.resolution)!=='未知'&&ori(c.source_resolution)!==ori(x.resolution)?'⚠ 源为 '+ori(c.source_resolution)+'，此输出为 '+ori(x.resolution)+'（模型/运行尺寸限制）':'';let lines=['模型与权重：'+x.model_version,'提示词版本：'+(x.prompt_version||'未记录'),'输入方式：'+modeZh(x),'精确高光帧：'+yn(x.explicit_t_star)+' / 时间控制：'+yn(x.time_control)+' / 相机轨迹：'+yn(x.camera_trajectory),'严格完成三阶段：'+yn(x.task_completed),'随机种子：'+x.seed,'输出：'+x.resolution+' / '+x.fps+' 帧/秒 / '+x.duration_s+' 秒',mismatch,'推理耗时：'+(x.inference_s||'未记录')+' 秒 / 峰值显存：'+(x.peak_vram_mib||'未记录')+' MiB','能力限制：'+limitZh(x),x.failure_reason?'失败原因（原始记录）：'+x.failure_reason:'',noteZh(x)?'画面质检：'+noteZh(x):''];if(x.condition_metadata)lines.push('条件片：源视频 '+x.condition_metadata.clip_start_s+' 秒起，共 '+x.condition_metadata.clip_frames+' 帧；高光在片内 '+x.condition_metadata.clip_t_star_s+' 秒');let original=['原始输入模式：'+(x.input_mode||''),'原始正向 Prompt：'+(x.prompt||''),'原始负向 Prompt：'+(x.negative_prompt||'未提供'),'原始运行说明：'+(x.manual_visual_note||''),'原始失败信息：'+(x.failure_reason||'')].join('\n\n');return lines.filter(Boolean).map(esc).join('\n')+'<details><summary>查看原始英文提示词与技术记录</summary><pre>'+esc(original)+'</pre></details>'}
function resultDetails(c,x,m){let saved=JSON.parse(localStorage.btV6GithubScores20261019||'{}')[c.id+'/'+m]||{};let ratings=S.map(n=>esc(n)+' <input type=number min=0 max=5 value="'+esc(saved[n]??'')+'" onchange="score(\''+esc(c.id+'/'+m)+'\',\''+esc(n)+'\',this.value)">').join('<br>');return '<details class=detail><summary>查看参数、质检与评分</summary><div class=detail-body>'+info(c,x)+'</div><div class=ratings><b>人工评分（0–5分）</b><br>'+ratings+'</div></details>'}
function player(p,label,useNative=false){return '<div class="media-shell"><video controls muted playsinline loop preload="none" data-src="'+esc(useNative?p.native_video:p.preview_video)+'" data-bytes="'+esc(useNative?p.native_bytes:p.preview_bytes)+'" data-buffer="blob" data-poster="'+esc(p.poster)+'" aria-label="'+esc(label)+'"></video></div>'}
function render(){window.ReviewMedia?.release(document.getElementById('app'));let h='<table><tr><th>测试视频</th><th>源视频</th>'+M.map(x=>'<th>'+esc(N[x])+'</th>').join('')+'</tr>';for(let c of C){h+='<tr><th>'+esc(c.id)+'<br><span class=muted>'+esc(c.target_zh)+'<br>高光帧 #'+esc(c.highlight_frame)+'</span></th>';h+='<td>'+player(c,'源视频 '+c.id)+'<p><a href="'+esc(c.native_video)+'" target="_blank" rel="noopener">原始源文件说明</a></p><details class=detail><summary>查看源视频信息</summary><div class=detail-body>主体：'+esc(c.target_zh)+'\n源尺寸：'+esc(c.source_resolution)+'（原素材尺寸；上方为全帧缩小浏览版） / '+esc(ori(c.source_resolution))+'\n高光事件：'+esc(c.event_zh)+'</div></details></td>';for(let m of M){let x=R.find(y=>y.case_id===c.id&&y.model===m);if(!x){h+='<td class=unsupported><b>未开始</b></td>';continue}h+='<td class='+esc(x.status)+'><b>'+esc(N[m])+' · '+esc(ST[x.status]||x.status)+'</b>'+player(x,m+' '+c.id,document.getElementById('kind').value==='native')+'<p><a href="'+esc(x.native_video)+'" target="_blank" rel="noopener">原生视频</a></p>'+resultDetails(c,x,m)+'</td>'}h+='</tr>'}document.getElementById('app').innerHTML=h+'</table>';window.ReviewMedia?.mount(document.getElementById('app'))}

function exp(f){let s=localStorage.btV6GithubScores20261019||'{}',b=new Blob([f==='json'?s:Object.entries(JSON.parse(s)).flatMap(([k,v])=>Object.entries(v).map(([n,x])=>k+','+n+','+x)).join('\n')],{type:'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='bullet-time-scores.'+f;a.click()}render();
</script></html>
